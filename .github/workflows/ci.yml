name: ci

# Required checks run offline and need no secrets. Live checks against a backend are a separate, explicit job that only
# runs when the repository is configured for it (see docs/staging-smoke-tests.md).

on:
  push:
    branches: [main, development]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # REQUIRED. Contract integrity, generated-client drift, types and offline tests.
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Lock and file agree, the contract is well formed, and the committed generated types equal a fresh generation.
      - run: npm run contract:check
      # A release must be built against a published contract, not a provisional local pin.
      - name: Release builds need a published contract
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/contract/check.mjs --require-release
      - run: npm run typecheck
      - run: npm test

  # OPTIONAL, credential-dependent. Runs only when the repository variable SMOKE_API_BASE_URL is set, never for pull
  # requests (so forks and ordinary PRs do not depend on staging). When it runs, missing configuration is a failure.
  staging-smoke:
    if: github.event_name != 'pull_request' && vars.SMOKE_API_BASE_URL != ''
    runs-on: ubuntu-latest
    env:
      SMOKE_REQUIRED: "1"
      SMOKE_API_BASE_URL: ${{ vars.SMOKE_API_BASE_URL }}
      SMOKE_SUPABASE_URL: ${{ vars.SMOKE_SUPABASE_URL }}
      SMOKE_SUPABASE_ANON_KEY: ${{ vars.SMOKE_SUPABASE_ANON_KEY }}
      SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:smoke

  staging-smoke-not-configured:
    if: github.event_name != 'pull_request' && vars.SMOKE_API_BASE_URL == ''
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::Staging smoke tests did not run because the repository variable SMOKE_API_BASE_URL is not set. See docs/staging-smoke-tests.md."

  # INFORMATIONAL. Tells maintainers when the backend has published a newer contract than the one pinned here.
  contract-freshness:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the pinned contract with the latest published one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(node -p "require('./contracts/contract-lock.json').version")
          latest=$(gh release list --repo A-Piyas-04/IUTverse --limit 100 --json tagName \
            --jq '[.[].tagName | select(startswith("api-contract-v"))] | sort_by(ltrimstr("api-contract-v") | split(".") | map(tonumber)) | last // empty' | sed 's/^api-contract-v//')
          if [ -z "$latest" ]; then
            echo "::notice::The backend has not published a contract release yet. Pinned: $pinned (provisional)."
          elif [ "$latest" != "$pinned" ]; then
            echo "::warning::A newer API contract is published ($latest); this repo pins $pinned. See docs/api-contract.md for the upgrade procedure."
          else
            echo "Pinned contract $pinned is the latest published."
          fi
